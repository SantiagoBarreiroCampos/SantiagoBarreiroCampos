<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Santiago Barreiro Campos - Computer Engineer">
  <style>
    .w {
      fill:#EC7000; stroke:#EC7000; stroke-width:1.6;
      fill-opacity:1; stroke-opacity:0;
      animation-duration:9s;
      animation-iteration-count:infinite;
      animation-timing-function:cubic-bezier(.45,.05,.25,1);
    }
    .bar   { animation:barPulse 9s ease-in-out infinite }
    .sweep { animation:sweep 9s cubic-bezier(.45,.05,.25,1) infinite }
    
    @keyframes toP {
        0%   { fill-opacity:.34; stroke-opacity:0 }
       10%   { fill-opacity:.66; stroke-opacity:0 }
       18%   { fill-opacity:.24; stroke-opacity:0 }
       26%   { fill-opacity:.58; stroke-opacity:0 }
       33%   { fill-opacity:1;   stroke-opacity:0 }
       88%   { fill-opacity:1;   stroke-opacity:0 }
      100%   { fill-opacity:.34; stroke-opacity:0 }
    }
    @keyframes toZ {
        0%   { fill-opacity:.30; stroke-opacity:0 }
        9%   { fill-opacity:.58; stroke-opacity:0 }
       17%   { fill-opacity:.20; stroke-opacity:0 }
       25%   { fill-opacity:.50; stroke-opacity:0 }
       33%   { fill-opacity:.12; stroke-opacity:0 }
       88%   { fill-opacity:.12; stroke-opacity:0 }
      100%   { fill-opacity:.30; stroke-opacity:0 }
    }
    @keyframes toM {
        0%   { fill-opacity:.40; stroke-opacity:0 }
       11%   { fill-opacity:.18; stroke-opacity:0 }
       19%   { fill-opacity:.62; stroke-opacity:0 }
       27%   { fill-opacity:.26; stroke-opacity:0 }
       33%   { fill-opacity:0;   stroke-opacity:.60 }
       88%   { fill-opacity:0;   stroke-opacity:.60 }
      100%   { fill-opacity:.40; stroke-opacity:0 }
    }
    @keyframes sweep {
        0%,  24% { transform:translateX(-40px); opacity:0 }
       29%      { opacity:.55 }
       50%      { opacity:.55 }
       56%, 100%{ transform:translateX(300px); opacity:0 }
    }
    @keyframes barPulse {
        0%, 100% { opacity:.55 }
       33%,  88% { opacity:1 }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .w, .bar, .sweep { animation: none }
      .sweep { opacity: 0 }
    }
  </style>

  <defs>
    <linearGradient id="sweepGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0"   stop-color="#EC7000" stop-opacity="0"/>
      <stop offset=".55" stop-color="#EC7000" stop-opacity="1"/>
      <stop offset="1"   stop-color="#EC7000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="239" rx="12" fill="#0D1117" stroke="#21262D"/>

  <rect class="bar" x="48" y="62" width="4" height="118" rx="2" fill="#EC7000"/>

  <text x="72" y="104" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#E6EDF3">Santiago Barreiro Campos</text>
  <text x="74" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8B949E">Computer Engineer &#183; Santander Digital Services &#183; Madrid</text>
  <text x="74" y="172" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EC7000">Low-bit neural networks &#183; distributed systems &#183; ML automation</text>

